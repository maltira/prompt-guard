[project]
name = "prompt-guard"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "openai>=3.40.0",
    "pandas>=3.1.0",
    "peft>=0.21.2",
    "pyarrow>=26.0.0",
    "python-dotenv>=1.2.4",
    "sacremoses>=0.2.0",
    "scikit-learn>=1.9.1",
    "sentence-transformers>=6.2.0",
    "sentencepiece>=0.2.2",
    "torch>=2.15.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
