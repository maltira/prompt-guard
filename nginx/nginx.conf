# входная точка: страница отдаётся из контейнера frontend, запросы /api/ идут в backend без префикса
events {}

http {
    server {
        listen 80;

        location /api/ {
            proxy_pass http://backend:8000/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            # судья отвечает секунды, а сравнение всех детекторов дольше одиночной проверки
            proxy_read_timeout 120s;
        }

        location / {
            proxy_pass http://frontend:80;
            proxy_set_header Host $host;
        }
    }
}
