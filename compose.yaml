services:
  nginx:
    image: nginx:alpine
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy

  frontend:
    image: prompt-guard-frontend:latest
    build: services/frontend
    pull_policy: build
    healthcheck:
      test: [ "CMD", "wget", "-q", "-O", "/dev/null", "http://localhost/" ]
      interval: 10s
      timeout: 5s
      retries: 6

  backend:
    image: prompt-guard-backend:latest
    build:
      context: .
      dockerfile: services/backend/Dockerfile
    pull_policy: build
    command: uvicorn gateway.app:app --host 0.0.0.0 --port 8000
    env_file: .env
    volumes:
      - ./results:/app/results
      - ${HF_CACHE_DIR:-${HOME}/.cache/huggingface}:/hf:ro
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')" ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
