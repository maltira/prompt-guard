services:
  gateway:
    image: prompt-guard:latest
    build: .
    pull_policy: build
    command: uvicorn gateway.app:app --host 0.0.0.0 --port 8000
    ports:
      - "127.0.0.1:8000:8000"
    env_file: .env
    volumes:
      - ./results:/app/results
      - ${HF_CACHE_DIR:-${HOME}/.cache/huggingface}:/hf:ro
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')" ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  target:
    image: prompt-guard:latest
    pull_policy: never
    command: uvicorn target.app:app --host 0.0.0.0 --port 8001
    ports:
      - "127.0.0.1:8001:8001"
    env_file: .env
    environment:
      GATEWAY_URL: http://gateway:8000
    volumes:
      - ./results:/app/results
      - ${HF_CACHE_DIR:-${HOME}/.cache/huggingface}:/hf:ro
    depends_on:
      gateway:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')" ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
